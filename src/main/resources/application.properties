# spring.h2.console.path=/h2-console


##### postgres #####
spring.datasource.url=jdbc:postgresql://localhost:5432/piqdb
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.spatial.dialect.postgis.PostgisPG95Dialect
spring.jpa.properties.hibernate.show_sql=true

#### HikeriCP 설정(db연결 끊김 방지 핵심) ####
#DB가 연결을 끊기 전에(보통 10~30분) 앱이 먼저 연결을 갱신하도록 설정
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000



#################### JWT 설정  ####################
# JWT 비밀 키 설정(환경변수로부터 값을 읽어오며, 없을 경우 기본값으로 'privateKey' 사용)
jwt.secret-key=${JWT_SECRET:cGxxLXByb2plY3Qtc2VjcmV0LWtleS1mb3Itand0LWF1dGhlbnRpY2F0aW9uLXN5c3RlbS1zcHJpbmctYm9vdA}
# JWT 토큰 만료 시간 설정 (1시간)
jwt.expiration=3600000
# JWT Issuer 설정
jwt.issuer=${JWT_ISSUER:PJT}
# JWT refresh Token 만료 기간 설정 (7일 = 7 * 24 * 3600 * 1000 ms)
jwt.refresh-expiration=604800000

#################### Redis configuration ####################
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=

#refresh Token max Age (14일)
refreshToken.maxAge=1209600

#################### Hibernate 설정 ####################
### N+1 문제 해결 ###
spring.jpa.properties.hibernate.default_batch_fetch_size=100

#################### 초기 관리자 계정 설정 ####################

# 초기화 활성화 여부
admin.account.creation.enabled=true 

# 초기 계정 이메일
admin.initial.email=admin@example.com

# (절대 코드에 직접 작성하지 말고, 안전하게 암호화할 것)
admin.initial.password=abcd1234!



#################### 파일 업로드 설정 ####################
# 1. 개별 파일의 최대 크기 설정 (예: 10MB)
spring.servlet.multipart.max-file-size=5MB

# 2. 한 번의 요청에 포함될 수 있는 모든 파일 및 데이터의 총 크기 설정 (예: 20MB)
# (max-file-size 보다 크거나 같아야 함)
spring.servlet.multipart.max-request-size=5MB

# 3. 로컬 파일 저장 경로
# 주의: 끝에 반드시 슬래시(/)를 붙여주세요.
app.upload.dir=C:/uploads/

# 4. 브라우저 접근용 URL 접두사
# 예: /uploads/ -> http://localhost:8080/uploads/이미지.jpg
app.upload.url-prefix=/uploads/

#################### 인앱 결제 설정 (In-App Purchase) ####################
# Google Play Developer API
google.play.package-name=your.package.name
google.play.service-account-key-path=keys/google-service-account.json

# Apple App Store Server API
apple.appstore.issuer-id=your-issuer-id
apple.appstore.key-id=your-key-id
apple.appstore.private-key-path=keys/apple-auth-key.p8
apple.appstore.bundle-id=your.bundle.id
apple.appstore.environment=sandbox
