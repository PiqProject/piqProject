spring.application.name=piqProject

# .env.properties 파일 import
spring.config.import=optional:file:.env.properties

#################### 관리자 계정 ####################
#초기화 활성화 여부
admin.account.creation.enabled=${admin.account.creation.enabled:true}

#초기 계정 이메일
admin.initial.email={admin.initial.email:admin@example.com}

#(절대 코드에 직접 작성하지 말고, 안전하게 암호화할 것)
admin.initial.password={admin.initial.password:abcd1234!}

#################### 프로필 설정 ####################
# prod: S3 사용
# local: 로컬 파일 사용
spring.profiles.active=local

# 애플 인앱결제 활성화 여부 (나중에 돈 내면 true로 변경)
apple.iap.enabled=false

#################### 비지니스 로직 설정 ####################
# 매칭 비용 설정(point 기준)
matching.cost.women=10
matching.cost.men=100

# 매칭 만료 스케줄러 (15분마다 실행)
matching.expired.scheduler.cron=0 0/15 * * * *


# 매일 추천 리셋 시간 설정 (0~23 사이의 값, 4시는 새벽 4시를 의미)
recommendation.reset-hour = 4
recommendation.scheduler.cron=0 0 ${recommendation.reset-hour} * * *

# 환불 가능기간 설정 (일 단위)
payment.refund.limit-days=7

#################### JPA/Hibernate 설정 ####################
# --- 핵심 설정 ---
# TODO: 현재는 table 자동 삭제, 출시할때 변경하기
# JPA(Hibernate)가 엔티티를 기반으로 테이블을 자동으로 생성하도록 설정
# create: 애플리케이션 시작 시 기존 테이블을 삭제하고 새로 생성 (개발용)
# create-drop: 시작 시 생성, 종료 시 삭제 (테스트용)
# update: 변경된 부분만 반영
# validate: 엔티티와 테이블이 일치하는지만 검증
# none: 자동 생성 기능 사용 안 함
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

# JPA가 테이블을 모두 생성한 이후에 data.sql 스크립트가 실행되도록 지연시킴
spring.jpa.defer-datasource-initialization=true

# data.sql 실행 모드 (always: 매번 실행, never: 실행 안 함)
spring.sql.init.mode=${SQL_INIT_MODE:never}

# JPA가 생성하는 SQL을 콘솔에 출력
spring.jpa.show-sql=false
#콘솔에 출력되는 SQL을 보기좋게 정렬
spring.jpa.properties.hibernate.format_sql=true

##################### 인코딩 설정 #####################
# 콘솔 및 파일 로그 출력을 UTF-8로 강제 지정
logging.charset.console=UTF-8
logging.charset.file=UTF-8


#################### Logging Configuration(simple) ####################
# if you want full configuration, check "logback-spring.xml"
# 로그 루트 경로
app.log.root-path=./logs

# 로그 파일 보관 기간 (일 단위) -> 14일 지나면 자동 삭제
app.log.max-history=14

# 관리자 접속 로그 DB 보관 기간 (일 단위) - 법적 최소 1년
app.log.retention-days-admin=365


