version: '3.8'

services:
  # 1. PostgreSQL (PostGIS 포함)
  postgres:
    image: postgis/postgis:15-3.3-alpine # 가벼운 Alpine 버전
    container_name: postgres
    environment:
      POSTGRES_DB: piqdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432" # 포트 연결
    volumes:
      - postgres_data:/var/lib/postgresql/data # 데이터 영구 저장
    networks:
      - piq_net

  # 2. Redis (기존 유지)
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - piq_net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  piq_net:
    driver: bridge
